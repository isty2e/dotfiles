name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
      - name: Install test dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh expect vim tmux
      - name: Install test dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          brew list --versions bash >/dev/null || brew install bash
          brew list --versions tmux >/dev/null || brew install tmux
      - name: Install mise and Python test dependencies
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' https://mise.run -o "$RUNNER_TEMP/install-mise.sh"
          mkdir -p "$HOME/.local/bin"
          MISE_INSTALL_PATH="$HOME/.local/bin/mise" sh "$RUNNER_TEMP/install-mise.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python -m pip install -r tests/keymaps/requirements.txt
      - name: Run offline tests
        run: |
          command -v mise
          command -v zsh
          command -v vim
          command -v nvim
          command -v expect
          command -v tmux
          sh tests/run.sh
