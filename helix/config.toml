theme = "papercolor-light"

[editor]
true-color = true

# Cycles and native baseline: docs/keymaps.md.
[keys.normal]
h = "move_char_left"
i = "move_char_right"
e = "move_visual_line_up"
n = "move_visual_line_down"

N = "join_selections"

u = "insert_mode"
l = "undo"
L = "redo"

k = "search_next"
K = "search_prev"

j = "move_next_word_end"
J = "move_next_long_word_end"
E = "keep_selections"

# Vacancies need explicit no_op bindings to suppress inherited defaults.
I = "no_op"
U = "insert_at_line_start"

[keys.select]
h = "extend_char_left"
i = "extend_char_right"
e = "extend_visual_line_up"
n = "extend_visual_line_down"

N = "join_selections"

u = "insert_mode"
l = "undo"
L = "redo"

k = "extend_search_next"
K = "extend_search_prev"

j = "extend_next_word_end"
J = "extend_next_long_word_end"
E = "keep_selections"

I = "no_op"
U = "insert_at_line_start"

[keys.normal.g]
n = "move_line_down"
e = "move_line_up"
i = "goto_line_end"
l = "goto_implementation"
k = "goto_next_buffer"
j = "goto_last_line"

[keys.select.g]
n = "extend_line_down"
e = "extend_line_up"
i = "goto_line_end"
l = "goto_implementation"
k = "goto_next_buffer"
j = "extend_to_last_line"

[keys.normal."C-w"]
h = "jump_view_left"
n = "jump_view_down"
e = "jump_view_up"
i = "jump_view_right"

H = "swap_view_left"
N = "swap_view_down"
E = "swap_view_up"
I = "swap_view_right"

k = { s = "hsplit_new", v = "vsplit_new", C-s = "hsplit_new", C-v = "vsplit_new" }

j = "no_op"
l = "no_op"
J = "no_op"
K = "no_op"
L = "no_op"

[keys.select."C-w"]
h = "jump_view_left"
n = "jump_view_down"
e = "jump_view_up"
i = "jump_view_right"

H = "swap_view_left"
N = "swap_view_down"
E = "swap_view_up"
I = "swap_view_right"

k = { s = "hsplit_new", v = "vsplit_new", C-s = "hsplit_new", C-v = "vsplit_new" }

j = "no_op"
l = "no_op"
J = "no_op"
K = "no_op"
L = "no_op"

[keys.normal.space.w]
h = "jump_view_left"
n = "jump_view_down"
e = "jump_view_up"
i = "jump_view_right"

