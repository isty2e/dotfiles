[tools]
# Runtimes and environments
node = "lts"
bun = "latest"
ruby = "latest"
go = "latest"
rust = "latest"
pixi = "latest"
uv = "latest"
pnpm = "latest"

# Editors and typesetting
vim = "latest"
neovim = "latest"
helix = "latest"
typst = "latest"

# Agent CLIs and terminal workspaces
antigravity-cli = "latest"
claude = "latest"
codex = "latest"
opencode = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
herdr = "latest"
tmux = "latest"

# Repository search and navigation
ripgrep = "latest"
fd = "latest"
fzf = "latest"
ast-grep = "latest"
codegraph = "latest"
"npm:@zvec/zvec-grep" = "latest"

# Repository delivery and task execution
github-cli = "latest"
just = "latest"

# Shell and system utilities
"conda:zstd" = "latest"
sheldon = "latest"
starship = "latest"
hyperfine = "latest"

# JavaScript and TypeScript quality
oxfmt = "latest"
oxlint = "latest"

# Keep the CLI independent of the Pixi base and the shell's Python provider.
[tools."pypi:pre-commit"]
version = "latest"
python = "3.13"

# Preserve the Homebrew command name without shadowing GNU coreutils' gdu.
[tools."github:dundee/gdu"]
version = "latest"
matching_regex = '^gdu_(darwin|linux)_(amd64|arm64)\.tgz$'
rename_exe = "gdu-go"
